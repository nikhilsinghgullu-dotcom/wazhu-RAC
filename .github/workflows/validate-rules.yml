
name: Wazuh RAC Validation and Deployment

on:
  push:
    branches:
      - main
      - feature/rac-validation

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Wazuh Rules
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: python3 --version

      - name: Validate XML syntax
        run: python3 scripts/validate_xml.py

      - name: Check duplicate rule IDs
        run: python3 scripts/check_rule_ids.py

  deploy:
    name: Deploy Rules to Wazuh
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare rules for deployment
        run: |
          set -e

          mkdir -p /home/wazhu/wazhu-rac-deploy/rules

          find /home/wazhu/wazhu-rac-deploy/rules \
            -maxdepth 1 -type f -name '*.xml' -delete

          if ! compgen -G "rules/*.xml" > /dev/null; then
            echo "ERROR: No XML rule files found"
            exit 1
          fi

          cp rules/*.xml /home/wazhu/wazhu-rac-deploy/rules/

          echo "Rules prepared for deployment:"
          ls -l /home/wazhu/wazhu-rac-deploy/rules/

      - name: Deploy to Wazuh Manager
        run: |
          sudo -n /usr/local/sbin/deploy-wazhu-rules

      - name: Verify deployment
        run: |
          set -e

          systemctl is-active --quiet wazuh-manager

          test -s /var/ossec/etc/rules/custom_ssh_rules.xml

          echo "Wazuh Manager is active"
          echo "Deployed rules:"
          ls -l /var/ossec/etc/rules/

          echo "Wazuh deployment verification successful"
